name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: AndroidLite
          options:
            bundleIdPrefix: com.androidlite
          targets:
            AndroidLite:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - App.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.androidlite.app
                  PRODUCT_NAME: AndroidLite
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Android Lite
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIStatusBarHidden: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: Android Lite camera app needs the camera to take photos.
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Android Lite saves your photos to your Photos library.
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AndroidLite.xcodeproj \
            -scheme AndroidLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AndroidLite.app Payload/
          zip -r AndroidLite.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidLite-ipa
          path: AndroidLite.ipa
